manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: Farsuperslime
      url-base: https://github.com/Farsuperslime
    - name: manna-harbour
      url-base: https://github.com/manna-harbour
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to a main commit (Zephyr 4.1 + the mid-2026 fixes for split
      # central sleep/wake lockups). No tagged ZMK release is on Zephyr 4.1
      # yet; revisit when v0.4.0 ships.
      revision: 641514a97db345f499dd50b0360e594270f008fe
      import: app/west.yml
    - name: prospector-zmk-module
      # Fork adding CONFIG_PROSPECTOR_IDLE_TIMEOUT_S (screen-off after
      # inactivity), smooth fade-out on idle, and symmetric fade-in on wake.
      # Based on carrefinho's feat/new-status-screens branch (Zephyr 4.1 /
      # ZMK-main-compatible). Branch tip currently 6148075 (export
      # prospector_last_brightness for the keyboard brightness behavior).
      # Hosted at github.com/Farsuperslime/prospector-zmk-module (public, so
      # no credentials are needed to clone it in CI or locally).
      remote: Farsuperslime
      revision: add-idle-timeout
    - name: miryoku_zmk
      remote: manna-harbour
      revision: master
  self:
    path: config
