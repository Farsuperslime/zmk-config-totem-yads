CONFIG_ZMK_USB_LOGGING=n

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery
# https://zmk.dev/docs/config/battery#peripheral-battery-monitoring
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Prospector status screen (carrefinho/prospector-zmk-module, classic
# layout by default -- see west.yml for the idle-timeout fork).
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50
CONFIG_PROSPECTOR_IDLE_TIMEOUT_S=30
# Operator layout: tech-dense grid with WPM meter, arc battery
# indicators, and per-layer dot strip.
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
# RAM budget: xiao_ble has 256KB. Operator's Kconfig wants a 20000-byte
# LVGL heap (needed at runtime to create widgets -- a 12288 pool links
# but starves widget allocation -> blank screen), while the double-buffered
# VDB draw buffer at 50% of frame eats 134KB. Halving VDB to 25% frees
# 67KB, covering the heap bump with margin.
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_Z_MEM_POOL_SIZE=20000
# YADS also had a keyboard brightness-step control (F23/F24) and a
# toggle key; prospector-zmk-module has no equivalent -- brightness is
# either ambient-sensor-driven or fixed, with no live keyboard control.

CONFIG_ZMK_POINTING=y
