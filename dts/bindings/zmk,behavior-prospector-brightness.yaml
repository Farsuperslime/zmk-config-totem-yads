description: Prospector display brightness behavior

compatible: "zmk,behavior-prospector-brightness"

# Provides "#binding-cells" (const 1), "display-name" and the deprecated
# "label". ZMK no longer ships a bare "behavior.yaml" -- bindings include
# one_param.yaml / two_param.yaml / zero_param.yaml instead.
include: one_param.yaml

properties:
  step:
    type: int
    default: 5
    description: |
      Brightness adjustment per INC/DEC press (1-100).
      The display brightness is clamped to 1-100.
